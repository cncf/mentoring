# Fallback approvers for projects whose governance model isn't fully
# captured by cncf/foundation/project-maintainers.csv or {org}/.project.
#
# The approvals workflow checks authorization in this order:
#   1. {org}/.project/maintainers.yaml (project-maintainers team)
#   2. cncf/foundation/project-maintainers.csv
#   3. This file — per-project fallback_handles
#   4. This file — global_approvers (can /approve for any project)
#
# Format:
#   global_approvers:             # can /approve any project
#     - username
#
#   <project-key>:                # match by GitHub org (e.g. open-telemetry), the
#                                 # lowercased/hyphenated name, or the projects.yml
#                                 # slug; any of the three works.
#     fallback_handles:           # individual GitHub handles (works for any org)
#       - username

global_approvers:
  - nate-double-u
  - dkrook
  - idvoretskyi
  - Swil78

kubernetes:
  # Kubernetes mentorship approvals run through SIG Contributor Experience
  # (SIG ContribEx). The sig-contribex team is cross-org (token can't read it), so
  # current SIG ContribEx leads are listed individually. Source: kubernetes/community
  # sig-contributor-experience leadership.
  #
  # Exclusive approvers: skip the project-maintainer rosters (the maintainers.yaml
  # and project-maintainers.csv tiers) so only the handles below plus
  # global_approvers can /approve. Kubernetes mentorship decisions are steering/
  # SIG-driven, not per-maintainer.
  maintainers_can_approve: false
  fallback_handles:
    - kaslin
    - mfahlandt
    - palnabarun
    - MadhavJivrajani
    - Priyankasaggu11929

# Kubernetes SUBPROJECTS route mentorship approvals through SIG ContribEx too,
# exactly like Kubernetes itself, so their own maintainer rosters are skipped and
# only the SIG ContribEx handles (plus global_approvers) can /approve. The roster
# below is duplicated from the `kubernetes` entry above; if SIG ContribEx
# leadership changes, update all three entries (kubernetes, etcd, headlamp) in
# lockstep. (cncf/mentoring#1995)
etcd:
  # kubernetes subproject (etcd-io/etcd)
  maintainers_can_approve: false
  fallback_handles:
    - kaslin
    - mfahlandt
    - palnabarun
    - MadhavJivrajani
    - Priyankasaggu11929

headlamp:
  # kubernetes subproject (kubernetes-sigs/headlamp)
  maintainers_can_approve: false
  fallback_handles:
    - kaslin
    - mfahlandt
    - palnabarun
    - MadhavJivrajani
    - Priyankasaggu11929

open-telemetry:
  # OTel governance (per @maryliag, cncf/mentoring#1930): each SIG has an
  # assigned GC liaison who ideally reviews that SIG's proposal, but any
  # Governance Committee member may /approve. SIG → liaison map:
  #   https://github.com/open-telemetry/community#specification-sigs
  # The governance-committee team is cross-org (token can't read it), so GC
  # members are listed individually. Roster (prune as terms end):
  #   https://github.com/open-telemetry/community/blob/main/community-members.md
  fallback_handles:
    - alolita
    - austinlparker
    - jpkrohling
    - maryliag
    - mtwo
    - mx-psi
    - svrnm
    - tedsuo
    - trask
